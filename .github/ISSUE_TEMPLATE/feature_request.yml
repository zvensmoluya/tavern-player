name: 体验建议 / Feature request
description: 说明你想改善的使用体验 / Suggest an improvement to the player experience.
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 遇到了什么问题 / What problem are you trying to solve?
      description: 从实际使用场景出发，中文或英文均可。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望怎样改善 / What would improve the experience?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 当前的替代方式 / Current workaround
      description: 可选。
